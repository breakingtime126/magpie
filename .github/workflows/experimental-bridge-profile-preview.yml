name: Experimental bridge profile draft tests

on:
  push:
    branches:
      - experiment/app-server-bridge-v0.1.3035
    paths:
      - .github/workflows/experimental-bridge-profile-preview.yml
      - scripts/bridge-profile-preview/**

permissions:
  contents: read

jobs:
  pure-profile-builder:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Test pure draft generation without opening the GUI
        # cmd creates a .cmd wrapper; PowerShell runs a real checked-out .ps1.
        # No execution-policy override: a policy refusal remains a failure.
        shell: cmd
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -File scripts\bridge-profile-preview\preview.ci.ps1 -ExpectedSha "%EXPECTED_SHA%"
