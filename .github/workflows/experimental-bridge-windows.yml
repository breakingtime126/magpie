name: Experimental bridge Windows

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/app-server-bridge-v0.1.3035

permissions:
  contents: read

concurrency:
  group: experimental-bridge-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-race:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[native-entry-4239-v1]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[app-server-4239-v1]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
      GOOS: linux
      GOARCH: amd64
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOTELEMETRY: 'off'
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Go version
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check out exact pre-fix cancellation behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 7631c8670354e90e19a73a624734c0fd15597009
          path: .ci-proc-cancel-baseline
          persist-credentials: false
      - name: Prove cancellation and reuse regressions before the fix
        shell: bash
        run: |
          set -euo pipefail
          export GOPATH="$(go env GOPATH)" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)"
          isolated="$(mktemp -d "$RUNNER_TEMP/proc-cancel-red.XXXXXX")"
          trap 'chmod -R u+w "$isolated"; rm -rf "$isolated" .ci-proc-cancel-baseline' EXIT
          export HOME="$isolated/home" CODEX_HOME="$isolated/codex"
          export XDG_CONFIG_HOME="$isolated/config" XDG_CACHE_HOME="$isolated/cache"
          export XDG_DATA_HOME="$isolated/data" XDG_STATE_HOME="$isolated/state" TMPDIR="$isolated/tmp"
          mkdir -p "$HOME" "$CODEX_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$TMPDIR"
          cp internal/proc/disclaim_cancel_test.go .ci-proc-cancel-baseline/internal/proc/
          status=0
          (cd .ci-proc-cancel-baseline && go test -race -v -count=1 -timeout=2m -tags nogui -run '^TestCombinedOutputOwnContextAfterStart$' ./internal/proc) >"$isolated/old.log" 2>&1 || status=$?
          cat "$isolated/old.log"
          test "$status" -ne 0
          grep -F -- '--- FAIL: TestCombinedOutputOwnContextAfterStart' "$isolated/old.log"
          grep -F -- 'started command returned signal: killed, want context.Canceled' "$isolated/old.log"
          cp internal/proc/disclaim.go internal/proc/disclaim_other.go .ci-proc-cancel-baseline/internal/proc/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.ci-proc-cancel-baseline/internal/proc/disclaim_other.go')
          s = p.read_text()
          assert s.count('alreadyStarted := cmd.Process != nil') == 1
          assert s.count('!alreadyStarted && ') == 1
          p.write_text(s.replace('alreadyStarted := cmd.Process != nil', '_ = cmd.Process').replace('!alreadyStarted && ', ''))
          PY
          status=0
          (cd .ci-proc-cancel-baseline && go test -race -v -count=1 -timeout=2m -tags nogui -run '^TestCombinedOutputOwnKeepsReuseErrors$' ./internal/proc) >"$isolated/reuse.log" 2>&1 || status=$?
          cat "$isolated/reuse.log"
          test "$status" -ne 0
          grep -F -- '--- FAIL: TestCombinedOutputOwnKeepsReuseErrors' "$isolated/reuse.log"
          grep -F -- 'reused command returned context canceled, want exec: already started' "$isolated/reuse.log"
          grep -F -- 'reused command returned context canceled, want exec: Stdout already set' "$isolated/reuse.log"
      - name: Check out exact pre-fix revert boundary behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 341298e1515298c6f8714509c78324f7f38dbe12
          path: .ci-thread-revert-baseline
          persist-credentials: false
      - name: Prove native revert boundaries fail behaviorally before the fix
        shell: bash
        run: |
          set -euo pipefail
          export GOPATH="$(go env GOPATH)" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)"
          isolated="$(mktemp -d "$RUNNER_TEMP/thread-revert-red.XXXXXX")"
          trap 'chmod -R u+w "$isolated"; rm -rf "$isolated" .ci-thread-revert-baseline' EXIT
          export HOME="$isolated/home" CODEX_HOME="$isolated/codex"
          export XDG_CONFIG_HOME="$isolated/config" XDG_CACHE_HOME="$isolated/cache"
          export XDG_DATA_HOME="$isolated/data" XDG_STATE_HOME="$isolated/state" TMPDIR="$isolated/tmp"
          mkdir -p "$HOME" "$CODEX_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$TMPDIR"
          cp internal/appserverbridge/thread_revert_test.go .ci-thread-revert-baseline/internal/appserverbridge/
          status=0
          (cd .ci-thread-revert-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestThreadRevertBeforeTurnIDRoutesToOwner$' ./internal/appserverbridge) >"$isolated/old.log" 2>&1 || status=$?
          cat "$isolated/old.log"
          test "$status" -eq 1
          grep -F -- '--- FAIL: TestThreadRevertBeforeTurnIDRoutesToOwner' "$isolated/old.log"
          grep -F -- 'native beforeTurnId did not reach its owner:' "$isolated/old.log"
          echo 'The exact baseline rejects native revert boundaries; compile or setup failures do not qualify.'
      - name: Test synthetic bridge and probe concurrency
        shell: bash
        run: |
          set -euo pipefail
          format_status=0
          format_diff="$(gofmt -d internal/appserverbridge internal/proc cmd/magpie-codex-bridge 2>&1)" || format_status=$?
          if [[ "$format_status" -ne 0 || -n "$format_diff" ]]; then
            printf '%s\n' "$format_diff"
            exit 1
          fi
          export GOPATH="$(go env GOPATH)" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)"
          isolated="$(mktemp -d "$RUNNER_TEMP/bridge-race.XXXXXX")"
          trap 'chmod -R u+w "$isolated"; rm -rf "$isolated"' EXIT
          export HOME="$isolated/home" CODEX_HOME="$isolated/codex"
          export XDG_CONFIG_HOME="$isolated/config" XDG_CACHE_HOME="$isolated/cache"
          export XDG_DATA_HOME="$isolated/data" XDG_STATE_HOME="$isolated/state"
          export TMPDIR="$isolated/tmp"
          mkdir -p "$HOME" "$CODEX_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$TMPDIR"
          export MAGPIE_BRIDGE_ADAPTER_TEST_EXE="$isolated/magpie-codex-bridge"
          go test -race -v -count=20 -timeout=5m -tags nogui -run '^TestCombinedOutputOwn' ./internal/proc
          go build -race -tags nogui -o "$MAGPIE_BRIDGE_ADAPTER_TEST_EXE" ./cmd/magpie-codex-bridge
          go test -race -v -count=20 -timeout=5m -tags nogui -run '^TestThreadRevert' ./internal/appserverbridge
          go test -race -v -count=1 -timeout=15m -tags nogui ./internal/appserverbridge ./internal/proc ./cmd/magpie-codex-bridge
          go test -race -v -count=20 -timeout=10m -tags nogui ./cmd/magpie-codex-bridge -run '^Test(DesktopPluginNativeChildrenReceiveExactOverride|BuiltAdapterDesktopPluginOverride)$'
          test -z "$(git status --porcelain)"

      - name: Test the pinned official runtime without external networking
        shell: bash
        run: bash build/test-official-runtime.sh

  windows-amd64:
    needs: bridge-race
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[native-entry-4239-v1]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[app-server-4239-v1]'))
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: amd64
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOTELEMETRY: 'off'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Go version
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test and package the experimental command
        run: ./build/package-bridge-windows.ps1
      - name: Upload the unsigned experimental artifact
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magpie-bridge-windows-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/bridge-package
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Record artifact identity
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          @"
          Source commit: $env:GITHUB_SHA
          Artifact ID: $env:ARTIFACT_ID
          Artifact URL: $env:ARTIFACT_URL
          Uploaded archive SHA-256: $env:ARTIFACT_DIGEST

          Unsigned experimental CLI only. No release, installation, Desktop integration or live model acceptance.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
