name: Experimental Codex connectivity preview GUI
on:
  push:
    branches: [experiment/app-server-bridge-v0.1.3035]
    paths:
      - cmd/magpie-codex-setup/**
      - internal/codexsetup/**
      - internal/nativepreview/**
      - build/package-codex-preview-windows.ps1
      - build/test-native-preview-official.ps1
      - .github/workflows/experimental-codex-connectivity-preview.yml
      - docs/subsystems/codex-connectivity-preview.md
permissions:
  contents: read
jobs:
  synthetic-linux:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Report formatting without changing artifact source
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/preview-format"
          mkdir -p "$out"
          gofmt -d cmd/magpie-codex-setup internal/codexsetup internal/nativepreview | tee "$out/gofmt.diff"
          bad="$(gofmt -l cmd/magpie-codex-setup internal/codexsetup internal/nativepreview)"
          while IFS= read -r file; do
            test -n "$file" || continue
            mkdir -p "$out/$(dirname "$file")"
            gofmt "$file" > "$out/$file"
          done <<< "$bad"
          test -z "$bad"
      - name: Vet the new pure packages
        id: vet
        continue-on-error: true
        run: go vet -tags nogui ./internal/nativepreview ./internal/codexsetup
      - name: Race and page-state regressions with synthetic inputs only
        run: |
          go test -race -tags nogui -count=1 -timeout=5m ./internal/nativepreview ./internal/codexsetup
          node internal/codexsetup/app.test.cjs
      - name: Upload formatting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-preview-format-${{ github.sha }}
          path: ${{ runner.temp }}/preview-format
          if-no-files-found: warn
          retention-days: 7
      - name: Require formatting and vet success
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          VET: ${{ steps.vet.outcome }}
        run: test "$FORMAT" = success && test "$VET" = success
  preview:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: amd64
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Build independent GUI, run synthetic tests and capture its own window
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -STA -File build\package-codex-preview-windows.ps1
      - name: Upload only the independent GUI package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Magpie-Codex-Connectivity-Preview-${{ github.sha }}
          path: ${{ runner.temp }}/codex-connectivity-package
          if-no-files-found: error
          retention-days: 7
      - name: Upload own-window evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-connectivity-window-${{ github.sha }}
          path: ${{ runner.temp }}/codex-connectivity-evidence
          if-no-files-found: warn
          retention-days: 7

  official-native-text:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035' && contains(github.event.head_commit.message, '[native-preview-text-v1]')
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      PREVIEW_NATIVE_TEXT_OPT_IN: native-preview-text-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile synthetic test host without running it
        shell: pwsh
        run: |
          go test -c -tags nogui -o "$env:RUNNER_TEMP/native-preview-tests.exe" ./internal/nativepreview
          if ($LASTEXITCODE -ne 0) { throw 'Test host compilation failed.' }
      - name: Verify official package and run only the opted-in loopback test
        shell: pwsh
        run: ./build/test-native-preview-official.ps1 -TestExecutable "$env:RUNNER_TEMP/native-preview-tests.exe"
      - name: Upload fixed-label acceptance report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-preview-text-${{ github.sha }}
          path: ${{ runner.temp }}/native-preview-text-report.json
          if-no-files-found: warn
          retention-days: 7
