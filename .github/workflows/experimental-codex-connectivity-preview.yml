name: Experimental original Magpie native Codex
on:
  push:
    branches: [experiment/app-server-bridge-v0.1.3035]
    paths:
      - internal/gui/**
      - internal/agent/**
      - internal/library/**
      - internal/buildvariant/**
      - internal/codexsetup/**
      - internal/nativepreview/**
      - internal/nativeconnect/**
      - internal/nativeconfigguard/**
      - internal/nativesupplier/**
      - internal/nativecatalog/**
      - internal/nativehost/**
      - internal/nativebootstrap/**
      - internal/nativechannel/**
      - internal/nativeendpoint/**
      - internal/nativelaunch/**
      - internal/nativeprofile/**
      - internal/appserverbridge/**
      - internal/proc/**
      - cmd/magpie-codex-bridge/**
      - internal/provider/**
      - internal/gateway/**
      - build/package-native-magpie-windows.ps1
      - build/original-connect-discovery*.ps1
      - build/original-connect-action*.ps1
      - build/original-desktop-*.ps1
      - build/mutate-bridge-shutdown-order.py
      - build/test-native-preview-official.ps1
      - .github/workflows/experimental-codex-connectivity-preview.yml
      - docs/subsystems/original-gui-native-codex.md
permissions:
  contents: read
jobs:
  synthetic-linux:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Report formatting without changing artifact source
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/preview-format"
          mkdir -p "$out"
          gofmt -d internal/codexsetup internal/nativepreview internal/nativeconnect internal/nativeconfigguard internal/nativesupplier internal/nativecatalog internal/nativehost internal/nativebootstrap internal/nativechannel internal/nativeendpoint internal/nativelaunch internal/nativeprofile internal/appserverbridge internal/proc cmd/magpie-codex-bridge internal/provider internal/gateway internal/gui internal/agent internal/library internal/buildvariant | tee "$out/gofmt.diff"
          bad="$(gofmt -l internal/codexsetup internal/nativepreview internal/nativeconnect internal/nativeconfigguard internal/nativesupplier internal/nativecatalog internal/nativehost internal/nativebootstrap internal/nativechannel internal/nativeendpoint internal/nativelaunch internal/nativeprofile internal/appserverbridge internal/proc cmd/magpie-codex-bridge internal/provider internal/gateway internal/gui internal/agent internal/library internal/buildvariant)"
          while IFS= read -r file; do
            test -n "$file" || continue
            mkdir -p "$out/$(dirname "$file")"
            gofmt "$file" > "$out/$file"
          done <<< "$bad"
          test -z "$bad"
      - name: Vet the new pure packages
        id: vet
        continue-on-error: true
        run: |
          go vet -tags nogui ./internal/nativepreview ./internal/nativeconnect ./internal/nativeconfigguard ./internal/provider ./internal/gateway ./internal/codexsetup ./internal/gui ./internal/agent ./internal/library
          go vet -tags nogui,nativecodex ./internal/nativeconnect ./internal/provider ./internal/gateway ./internal/gui ./internal/agent ./internal/library
          go vet -tags nogui,nativecodex ./internal/nativesupplier ./internal/nativecatalog ./internal/nativehost ./internal/nativebootstrap ./internal/nativechannel ./internal/nativeendpoint ./internal/nativelaunch ./internal/nativeprofile
      - name: Race and page-state regressions with synthetic inputs only
        run: |
          go test -race -tags nogui -count=1 -timeout=10m ./internal/nativepreview ./internal/codexsetup ./internal/agent ./internal/library ./internal/gui
          go test -race -tags nogui -count=1 -timeout=5m ./internal/nativeconnect ./internal/nativeconfigguard
          go test -race -tags nogui,nativecodex -count=1 -timeout=5m ./internal/nativeconnect
          go test -race -tags nogui,nativecodex -count=1 -timeout=5m ./internal/nativesupplier ./internal/nativecatalog ./internal/nativehost ./internal/nativebootstrap ./internal/nativechannel ./internal/nativeendpoint ./internal/nativelaunch ./internal/nativeprofile
          go test -race -tags nogui -count=1 -timeout=5m -run '^TestConfiguredSupplier' ./internal/provider
          go test -race -tags nogui,nativecodex -count=1 -timeout=5m -run '^TestConfiguredSupplier' ./internal/provider
          go test -race -tags nogui -count=1 -timeout=5m -run "^TestNativeGPT" ./internal/provider ./internal/gateway
          go test -race -tags nogui,nativecodex -count=1 -timeout=5m -run "^TestNative(Codex|GPT)" ./internal/provider ./internal/gateway ./internal/agent ./internal/library ./internal/gui
          node internal/codexsetup/app.test.cjs
      - name: Original page browser regressions, both engines and languages
        env:
          NODE_PATH: ${{ runner.temp }}/magpie-ui/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/magpie-ui" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.61.1
          "$RUNNER_TEMP/magpie-ui/node_modules/.bin/playwright" install --with-deps chromium webkit
          node --test internal/gui/tests/codex-connect-switch-state.test.cjs internal/gui/tests/codex-connect-recovery.test.cjs internal/gui/tests/agent-connect.test.cjs internal/gui/tests/agent-connect-no-models.test.cjs internal/gui/tests/agent-connected-unfolded.test.cjs internal/gui/tests/codex-native.test.cjs
      - name: Upload formatting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-preview-format-${{ github.sha }}
          path: ${{ runner.temp }}/preview-format
          if-no-files-found: warn
          retention-days: 7
      - name: Require formatting and vet success
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          VET: ${{ steps.vet.outcome }}
        run: test "$FORMAT" = success && test "$VET" = success
  preview:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: amd64
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify original acceptance safety fixtures in both PowerShell hosts
        if: contains(github.event.head_commit.message, '[original-connect-desktop-v1]')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($hostName in @('pwsh', 'powershell')) {
            & $hostName -NoProfile -NonInteractive -File build/original-desktop-package.tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Official package safety fixtures failed.' }
            & $hostName -NoProfile -NonInteractive -File build/original-desktop-sequence.tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Original recovery sequencing fixtures failed.' }
          }
          & pwsh -NoProfile -NonInteractive -File build/original-connect-action.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Original action fixtures failed.' }
          & pwsh -NoProfile -NonInteractive -File build/original-connect-action.mutations.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Original action red mutations failed.' }
          & pwsh -NoProfile -NonInteractive -File build/original-desktop-acceptance.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Original acceptance caller fixtures failed.' }
          & pwsh -NoProfile -NonInteractive -File build/original-desktop-quit-discovery.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Owned tray discovery fixtures failed.' }
          & pwsh -NoProfile -NonInteractive -File build/original-desktop-quit-discovery.mutations.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Owned tray discovery mutations failed.' }
          & powershell -NoProfile -NonInteractive -File build/original-desktop-window-capture.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Owned diagnostic capture fixtures failed.' }
          & powershell -NoProfile -NonInteractive -File build/original-desktop-window-capture.mutations.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Owned diagnostic capture mutations failed.' }
      - name: Build original portable GUI with native Codex protection and capture its window
        shell: pwsh
        env:
          ORIGINAL_CONNECT_DISCOVERY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[original-connect-discovery-v1]') }}
          ORIGINAL_CONNECT_ACCEPTANCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[original-connect-desktop-v1]') }}
          MAGPIE_ORIGINAL_CONNECT_ACTION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[original-connect-desktop-v1]') && 'original-ui-v1' || '' }}
          MAGPIE_ORIGINAL_DESKTOP_ACCEPTANCE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[original-connect-desktop-v1]') && 'original-ui-v1' || '' }}
          MAGPIE_ORIGINAL_WINDOW_CAPTURE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[original-connect-desktop-v1]') && 'diagnostic-v1' || '' }}
          MAGPIE_ORIGINAL_QUIT_DISCOVERY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[original-connect-desktop-v1]') && 'read-only-v1' || '' }}
          MAGPIE_ORIGINAL_CONNECT_DISCOVERY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[original-connect-discovery-v1]') && 'read-only-v1' || '' }}
        run: ./build/package-native-magpie-windows.ps1 -DiscoverOriginalConnect:($env:ORIGINAL_CONNECT_DISCOVERY -ceq 'true') -AcceptOriginalConnect:($env:ORIGINAL_CONNECT_ACCEPTANCE -ceq 'true')
      - name: Upload the original Magpie portable experimental package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Magpie-Native-Codex-Experimental-${{ github.sha }}
          path: ${{ runner.temp }}/native-magpie-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload own-window evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-magpie-window-${{ github.sha }}
          path: ${{ runner.temp }}/native-magpie-evidence
          if-no-files-found: warn
          retention-days: 7

  official-native-text:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035' && (contains(github.event.head_commit.message, '[native-preview-text-v1]') || contains(github.event.head_commit.message, '[native-supplier-catalog-v1]'))
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      PREVIEW_NATIVE_TEXT_OPT_IN: native-preview-text-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile synthetic test host without running it
        shell: pwsh
        run: |
          go test -c -tags nogui -o "$env:RUNNER_TEMP/native-preview-tests.exe" ./internal/nativepreview
          if ($LASTEXITCODE -ne 0) { throw 'Test host compilation failed.' }
      - name: Verify official package and run only the opted-in loopback test
        shell: pwsh
        run: |
          $testExecutable = Join-Path $env:RUNNER_TEMP 'native-preview-tests.exe'
          $message = (& git log -1 --format=%B) -join "`n"
          $testName = if ($message.Contains('[native-supplier-catalog-v1]')) { 'TestOfficialNativeSupplierCatalogText' } else { 'TestOfficialNativePreviewText' }
          ./build/test-native-preview-official.ps1 -TestExecutable $testExecutable -TestName $testName
      - name: Upload fixed-label acceptance report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-preview-text-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-preview-text-report.json
            ${{ runner.temp }}/native-supplier-catalog-text-report.json
          if-no-files-found: warn
          retention-days: 7
