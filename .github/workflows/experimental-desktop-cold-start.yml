name: Experimental Desktop cold start

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/app-server-bridge-v0.1.3035
    paths:
      - .github/workflows/experimental-desktop-cold-start.yml
      - build/test-desktop-cold-start.ps1

permissions:
  contents: read

concurrency:
  group: experimental-desktop-cold-start-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official-baseline:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035'
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the exact experimental commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect syntax without running the Desktop probe
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'build/test-desktop-cold-start.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'PowerShell syntax validation failed.' }
      - name: Verify official package and attempt licensed cold start
        run: ./build/test-desktop-cold-start.ps1
      - name: Upload only public identity and sanitized startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-desktop-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-cold-start-report
          if-no-files-found: error
          retention-days: 7
