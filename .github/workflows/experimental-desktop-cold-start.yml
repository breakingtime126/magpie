name: Experimental Desktop cold start

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/app-server-bridge-v0.1.3035
    paths:
      - .github/workflows/experimental-desktop-cold-start.yml
      - build/test-desktop-cold-start.ps1
      - cmd/magpie-codex-bridge/**
      - internal/appserverbridge/**

permissions:
  contents: read

concurrency:
  group: experimental-desktop-cold-start-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official-baseline:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[winapp-inspection-v0.7.1]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[native-entry-4239-v1]'))
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the exact experimental commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect syntax without running the Desktop probe
        run: |
          $errors = $null
          $tokens = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'build/test-desktop-cold-start.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'PowerShell syntax validation failed.' }
          $reserved = @('HOME', 'PID', 'Host', 'PSHOME', 'PSVersionTable', 'PSEdition', 'ShellId', 'ExecutionContext')
          $assignments = $ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.AssignmentStatementAst]
          }, $true)
          foreach ($assignment in $assignments) {
            if ($assignment.Left -is [System.Management.Automation.Language.VariableExpressionAst] -and
                $reserved -contains $assignment.Left.VariablePath.UserPath) {
              throw ('Assignment to a protected PowerShell automatic variable: ' + $assignment.Left.VariablePath.UserPath)
            }
          }
      - name: Verify official package and attempt licensed cold start
        run: ./build/test-desktop-cold-start.ps1
      - name: Upload only public identity and sanitized startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-desktop-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-cold-start-report
          if-no-files-found: error
          retention-days: 7

  bridge-alias:
    needs: official-baseline
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[winapp-inspection-v0.7.1]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[native-entry-4239-v1]'))
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: amd64
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOTELEMETRY: 'off'
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the exact experimental commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Go version
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the exact bridge without changing its behavior
        run: |
          $bridge = Join-Path $env:RUNNER_TEMP ('magpie-ci-' + $env:GITHUB_SHA.Substring(0, 8) + '.exe')
          go build -trimpath -tags nogui -o $bridge ./cmd/magpie-codex-bridge
          if ($LASTEXITCODE -ne 0) { throw 'Bridge build failed.' }
      - name: Test the registered official alias in this fresh VM
        run: |
          $bridge = Join-Path $env:RUNNER_TEMP ('magpie-ci-' + $env:GITHUB_SHA.Substring(0, 8) + '.exe')
          ./build/test-desktop-cold-start.ps1 -Mode bridge -BridgeExecutable $bridge
      - name: Upload sanitized bridge-launch evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-desktop-bridge-alias-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-cold-start-report
          if-no-files-found: error
          retention-days: 7
