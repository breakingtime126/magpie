name: Experimental Desktop 4239 native entry

on:
  push:
    branches: [experiment/app-server-bridge-v0.1.3035]
    paths:
      - .github/workflows/experimental-desktop-native-entry-4239.yml
      - build/desktop-native-entry.ps1
      - build/desktop-native-entry.tests.ps1
      - build/desktop-entry-observe.ps1
      - build/desktop-entry-activate.ps1
      - build/test-desktop-cold-start.ps1
      - build/test-desktop-ci-profile.ps1
      - build/desktop-live-welcome.ps1
      - docs/subsystems/desktop-cold-start.md

permissions:
  contents: read

concurrency:
  group: experimental-desktop-native-entry-4239-${{ github.ref }}
  cancel-in-progress: false

jobs:
  treatment:
    if: >-
      github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035' &&
      github.event_name == 'push' && contains(github.event.head_commit.message, '[native-entry-4239-v1]') &&
      !contains(github.event.head_commit.message, '[winapp-inspection-v0.7.1]') &&
      !contains(github.event.head_commit.message, '[renderer-menu-review-v1]') &&
      !contains(github.event.head_commit.message, '[bridge-ui-4239-v1]') &&
      !contains(github.event.head_commit.message, '[package-identity-only-v1]') &&
      !contains(github.event.head_commit.message, '[native-ui-inspection-v1]') &&
      !contains(github.event.head_commit.message, '[native-contract-review-v1]')
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: amd64
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require both hosts and retain fixed prerequisite diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'desktop-entry-4239-safety'
          New-Item -ItemType Directory -Path $directory | Out-Null
          $gate = [ordered]@{schema=1;scope='native-entry-safety-only';fixtureScope='treatment';status='failed';rollbackMutationRejected=$false;
            core='not-run';desktop='not-run';profiles='not-run'}
          try {
            $savedNativePreference = $PSNativeCommandUseErrorActionPreference
            try {
              $PSNativeCommandUseErrorActionPreference = $false
              $output = & pwsh -NoProfile -NonInteractive -File build/desktop-native-entry.tests.ps1 -TreatmentPrerequisites -BreakRestoration 2>&1
              $status = $LASTEXITCODE
            } finally { $PSNativeCommandUseErrorActionPreference = $savedNativePreference }
            if ($status -eq 0 -or ($output | Out-String) -notlike '*treatment rollback removes both introduced values*') {
              throw 'Missing-second-rollback mutation did not fail the behavior assertion.'
            }
            $gate.rollbackMutationRejected = $true
            foreach ($hostName in @('core','desktop')) {
              $executable = 'pwsh'
              if ($hostName -ceq 'desktop') { $executable = 'powershell' }
              $diagnostic = Join-Path $directory ($hostName + '.json')
              $gate[$hostName] = 'failed'
              & $executable -NoProfile -NonInteractive -File build/desktop-native-entry.tests.ps1 -TreatmentPrerequisites -DiagnosticPath $diagnostic
              if ($LASTEXITCODE -ne 0) { throw 'Native-entry safety fixtures failed; treatment is not attempted.' }
              $evidence = [IO.File]::ReadAllText($diagnostic) | ConvertFrom-Json
              $expectedHost = 'Core'
              if ($hostName -ceq 'desktop') { $expectedHost = 'Desktop' }
              if ($evidence.schema -ne 1 -or $evidence.scope -cne 'native-entry-safety-only' -or
                  $evidence.host -cne $expectedHost -or $evidence.status -cne 'passed' -or
                  $evidence.fixtureScope -cne 'treatment' -or
                  $evidence.zeroRecords -cne 'not-run' -or $evidence.ownedProcess -cne 'not-run') {
                throw 'Both hosts must pass treatment prerequisites without claiming the separate observation fixtures ran.'
              }
              $gate[$hostName] = 'passed'
            }
            $gate.profiles = 'failed'
            & powershell -NoProfile -NonInteractive -File build/test-desktop-ci-profile.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Default and selected profile fixtures failed.' }
            $gate.profiles = 'passed'
            $gate.status = 'passed'
          } finally {
            [IO.File]::WriteAllText((Join-Path $directory 'gate.json'), ($gate | ConvertTo-Json -Compress), [Text.UTF8Encoding]::new($false))
          }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact commit bridge
        shell: powershell
        run: |
          $bridge = Join-Path $env:RUNNER_TEMP ('magpie-ci-' + $env:GITHUB_SHA.Substring(0, 8) + '.exe')
          go build -trimpath -tags nogui -o $bridge ./cmd/magpie-codex-bridge
          if ($LASTEXITCODE -ne 0) { throw 'Bridge build failed.' }
      - name: Run one original AUMID with reviewed compatibility and verify persistent rollback
        shell: powershell
        env:
          MAGPIE_NATIVE_ENTRY_PROFILE: user-aumid-4239-compat-v1
        run: |
          $bridge = Join-Path $env:RUNNER_TEMP ('magpie-ci-' + $env:GITHUB_SHA.Substring(0, 8) + '.exe')
          ./build/test-desktop-cold-start.ps1 -Mode bridge -BridgeExecutable $bridge -NativeEntryCase treatment -EnableReviewedEntry4239 -EnableReviewedEntryCompatibility
      - name: Preserve fixed safety diagnostics and sanitized treatment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-native-entry-4239-${{ github.sha }}
          path: |
            ${{ runner.temp }}/desktop-entry-4239-safety/gate.json
            ${{ runner.temp }}/desktop-entry-4239-safety/core.json
            ${{ runner.temp }}/desktop-entry-4239-safety/desktop.json
            ${{ runner.temp }}/desktop-cold-start-report/report.json
            ${{ runner.temp }}/desktop-cold-start-report/official-window.png
            ${{ runner.temp }}/desktop-cold-start-report/signature.txt
          if-no-files-found: warn
          retention-days: 7
