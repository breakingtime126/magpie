  observed-policy-read:
    needs: observer-unit
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035' && !(github.event_name == 'push' && (contains(github.event.head_commit.message, '[native-ui-inspection-v1]') || contains(github.event.head_commit.message, '[native-contract-review-v1]'))) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[native-entry-4239-v1]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[renderer-menu-review-v1]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[app-server-4239-v1]'))
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      MAGPIE_BRIDGE_OWNED_CATALOG: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[bridge-owned-catalog-v1]') && 'bridge-owned-catalog-v1' || '' }}
      MAGPIE_MODEL_SELECTION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[bridge-model-selection-v1]') && 'bridge-model-selection-v1' || '' }}
      MAGPIE_MODEL_SETTINGS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[bridge-model-settings-v1]') && 'bridge-model-settings-v1' || '' }}
      MAGPIE_DESKTOP_SYNTHETIC_MODELS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop-synthetic-models-v1]') && 'desktop-synthetic-models-v1' || '' }}
      MAGPIE_WELCOME_4239: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[bridge-welcome-4239-v1]') && 'bridge-welcome-4239-v1' || '' }}
      CGO_ENABLED: '0'
      GOOS: windows
      GOARCH: amd64
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOTELEMETRY: 'off'
      MAGPIE_WINAPP_INSPECTION: ${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[winapp-inspection-v0.7.1]')) || (github.event_name == 'workflow_dispatch' && inputs.inspection_mode == 'winapp-inspection-v0.7.1' && inputs.expected_sha == github.sha)) && 'winapp-inspection-v0.7.1' || '' }}
      MAGPIE_REVIEWED_BUILD: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[bridge-ui-4239-v1]') && contains(github.event.head_commit.message, '[winapp-inspection-v0.7.1]') && 'bridge-ui-4239-v1' || '' }}
      MAGPIE_PACKAGE_IDENTITY_ONLY: ${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[package-identity-only-v1]') && contains(github.event.head_commit.message, '[winapp-inspection-v0.7.1]')) || (github.event_name == 'workflow_dispatch' && inputs.inspection_mode == 'package-identity-only-v1' && inputs.expected_sha == github.sha)) && 'package-identity-only-v1' || '' }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out the exact experimental commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the pinned Go version
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check out exact pre-catalog observer behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a54fd10a36483aaaf6498b3ce47682ae9f3415e9
          path: .ci-public-catalog-baseline
          persist-credentials: false
      - name: Prove source-bound catalog references fail on the old Windows observer
        run: |
          Copy-Item build/desktop-rpc-observer/config_public_catalog_red_test.go .ci-public-catalog-baseline/build/desktop-rpc-observer/
          Push-Location .ci-public-catalog-baseline
          $savedPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $output = @(& go test -v -count=1 -timeout=5m -tags nogui -run '^TestPublicCatalogExecutableUsesBoundRefsWithoutMutation$' ./build/desktop-rpc-observer 2>&1)
            $status = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $savedPreference
            Pop-Location
          }
          $text = $output | Out-String
          Write-Output $text
          if ($status -eq 0 -or $text -notmatch '--- FAIL: TestPublicCatalogExecutableUsesBoundRefsWithoutMutation' -or
              -not $text.Contains('catalog argument was not identified by the bound public index')) {
            throw 'The old observer must fail the catalog behavior assertion, not compile or skip.'
          }
          # GitHub's PowerShell epilogue propagates native LASTEXITCODE; this failure was just verified as expected.
          $global:LASTEXITCODE = 0
      - name: Check probe syntax before execution
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'build/test-desktop-cold-start.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Probe syntax validation failed.' }
      - name: Test startup profiles on Windows and build exact bridge
        run: |
          powershell -NoProfile -File build/test-desktop-public-catalog.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Public catalog validation tests failed.' }
          powershell -NoProfile -File build/test-desktop-ci-profile.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CI compatibility profile tests failed.' }
          node --max-old-space-size=512 --test build/inspect-desktop-static-metadata.test.mjs build/inspect-desktop-public-plugin-metadata.test.mjs build/inspect-desktop-public-plugin-ast.test.mjs build/inspect-desktop-public-plugin-ast-red.test.mjs build/inspect-desktop-ast-limits-red.test.mjs build/inspect-desktop-mcp-catalog.test.mjs build/inspect-desktop-mcp-catalog-red.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Static metadata inspector tests failed.' }
          node --max-old-space-size=1024 --test build/inspect-desktop-read-callers.test.mjs build/inspect-desktop-read-callers-package.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Read caller inspector tests failed.' }
          go test -count=1 -timeout=10m -tags nogui ./build/control-plane-native ./build/desktop-rpc-observer ./internal/appserverbridge ./cmd/magpie-codex-bridge
          if ($LASTEXITCODE -ne 0) { throw 'Windows observer tests failed.' }
          $bridge = Join-Path $env:RUNNER_TEMP ('magpie-ci-' + $env:GITHUB_SHA.Substring(0, 8) + '.exe')
          $observer = Join-Path $env:RUNNER_TEMP ('magpie-observer-' + $env:GITHUB_SHA.Substring(0, 8) + '.exe')
          go build -trimpath -tags nogui -o $bridge ./cmd/magpie-codex-bridge
          if ($LASTEXITCODE -ne 0) { throw 'Production bridge build failed.' }
          go build -trimpath -o $observer ./build/desktop-rpc-observer
          if ($LASTEXITCODE -ne 0) { throw 'Test observer build failed.' }
          $native = Join-Path $env:RUNNER_TEMP ('magpie-control-native-' + $env:GITHUB_SHA.Substring(0, 8) + '.exe')
          go build -trimpath -o $native ./build/control-plane-native
          if ($LASTEXITCODE -ne 0) { throw 'Native control-plane acceptance helper build failed.' }
      - name: Materialize the pinned public native model fixture
        if: env.MAGPIE_DESKTOP_SYNTHETIC_MODELS == ''
        run: |
          $catalog = Join-Path $env:RUNNER_TEMP 'magpie-control-native-models.json'
          if (Test-Path -LiteralPath $catalog) { throw 'Native model fixture target already exists.' }
          $url = 'https://raw.githubusercontent.com/openai/codex/c40729ea5cf8e947481b130c59807273eda2f8e9/codex-rs/models-manager/models.json'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $catalog
          $file = Get-Item -LiteralPath $catalog
          if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
              $file.Length -le 0 -or $file.Length -gt 10485760) { throw 'Native model fixture has invalid size or type.' }
          $bytes = [IO.File]::ReadAllBytes($catalog)
          $header = [Text.Encoding]::ASCII.GetBytes("blob " + $bytes.Length + [char]0)
          $sha = [Security.Cryptography.SHA1]::Create()
          try {
            $hash = $sha.ComputeHash([byte[]]($header + $bytes))
            $actual = ([BitConverter]::ToString($hash)).Replace('-', '').ToLowerInvariant()
            if ($actual -cne '489ebe3f2483348641a16160ce8491dd077eabca') { throw 'Native model fixture identity mismatch.' }
          } finally { $sha.Dispose() }
          Write-Output 'Pinned public native catalog fixture verified; this is not live entitlement evidence.'
      - name: Check live welcome syntax and offline policy fixtures
        shell: pwsh
        run: |
          foreach ($file in @('build/desktop-live-welcome.ps1','build/desktop-live-welcome.tests.ps1','build/desktop-welcome-step.ps1','build/desktop-welcome-step.tests.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw 'Live welcome syntax validation failed.' }
          }
          $readOnly4239 = $env:MAGPIE_REVIEWED_BUILD -ceq 'bridge-ui-4239-v1' -and $env:MAGPIE_WINAPP_INSPECTION -ceq 'winapp-inspection-v0.7.1' -and [string]$env:MAGPIE_PACKAGE_IDENTITY_ONLY -ceq ''
          $welcome4239 = $env:MAGPIE_WELCOME_4239 -ceq 'bridge-welcome-4239-v1'
          ./build/desktop-live-welcome.tests.ps1 -SkipWindowsHelperSmoke:$readOnly4239
          if ($LASTEXITCODE -ne 0) { throw 'Live welcome integration fixtures failed.' }
          if ($readOnly4239 -and !$welcome4239) {
            Write-Output 'WELCOME_ACTION_POLICY_CHECK=not_run_read_only_inspection'
          } elseif ($welcome4239) {
            ./build/desktop-welcome-step.tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Welcome policy fixtures failed.' }
            ./build/desktop-winapp-welcome.tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Official-tool welcome fixtures failed.' }
          } else {
            powershell -NoProfile -NonInteractive -File build/desktop-welcome-step.tests.ps1 -CheckNativeInterop
            if ($LASTEXITCODE -ne 0) { throw 'Welcome policy fixtures failed.' }
          }
      - name: Check official-tool observation fixtures offline
        shell: pwsh
        run: |
          $savedNativePreference=$PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference=$false
            $mutation=& pwsh -NoProfile -File build/desktop-winapp-inspect.tests.ps1 -BreakRedaction 2>&1
            $mutationExit=$LASTEXITCODE
          } finally { $PSNativeCommandUseErrorActionPreference=$savedNativePreference }
          if ($mutationExit -eq 0 -or ($mutation|Out-String) -notlike '*FAIL: raw UI text never enters public summary*') {
            throw 'Redaction mutation did not fail its behavior assertion.'
          }
          $global:LASTEXITCODE=0
          ./build/desktop-winapp-inspect.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Official-tool observation fixtures failed.' }
          ./build/desktop-winapp-inspect.native.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native-tree login evidence fixtures failed.' }
      - name: Observe the explicitly selected disposable Desktop slice
        shell: pwsh
        run: |
          $bridge = Join-Path $env:RUNNER_TEMP ('magpie-ci-' + $env:GITHUB_SHA.Substring(0, 8) + '.exe')
          $observer = Join-Path $env:RUNNER_TEMP ('magpie-observer-' + $env:GITHUB_SHA.Substring(0, 8) + '.exe')
          $native = Join-Path $env:RUNNER_TEMP ('magpie-control-native-' + $env:GITHUB_SHA.Substring(0, 8) + '.exe')
          $inspection = $env:MAGPIE_WINAPP_INSPECTION -ceq 'winapp-inspection-v0.7.1'
          $packageIdentity = $env:MAGPIE_PACKAGE_IDENTITY_ONLY -ceq 'package-identity-only-v1'
          $build4239 = $env:MAGPIE_REVIEWED_BUILD -ceq 'bridge-ui-4239-v1'
          $welcome4239 = $env:MAGPIE_WELCOME_4239 -ceq 'bridge-welcome-4239-v1'
          $selectionProfile=''
          if ($env:MAGPIE_MODEL_SELECTION -ceq 'bridge-model-selection-v1') { $selectionProfile='bridge-owned-model-selection-4239' }
          elseif ([string]$env:MAGPIE_MODEL_SELECTION -cne '') { throw 'Unreviewed model-selection marker.' }
          if ($selectionProfile -and $env:MAGPIE_BRIDGE_OWNED_CATALOG -cne 'bridge-owned-catalog-v1') { throw 'Model selection requires owned catalog.' }
          $settingsProfile=''
          if ($env:MAGPIE_MODEL_SETTINGS -ceq 'bridge-model-settings-v1') { $settingsProfile='bridge-owned-model-settings-4239' }
          elseif ([string]$env:MAGPIE_MODEL_SETTINGS -cne '') { throw 'Unreviewed model-settings marker.' }
          if ($settingsProfile -and -not $selectionProfile) { throw 'Model settings require explicit selection.' }
          if ($env:MAGPIE_BRIDGE_OWNED_CATALOG -ceq 'bridge-owned-catalog-v1') {
              ./build/test-desktop-cold-start.ps1 -Mode observe -BridgeExecutable $bridge -ObserverExecutable $observer -NativeControlExecutable $native -DesktopFixtureProfile bridge-owned-catalog-4239 -DesktopModelSelectionProfile $selectionProfile -DesktopModelSettingsProfile $settingsProfile -EnableReviewedStartupProbe -EnableReviewedLaunchCompatibility -EnableReviewedLiveWelcome:(($welcome4239 -or !$inspection) -and !$packageIdentity) -EnableReviewedWelcome4239:$welcome4239 -EnableReadOnlyWinAppInspection:($inspection -and !$packageIdentity -and !$welcome4239) -InspectPackageIdentityOnly:$packageIdentity -EnableReviewedBuild4239:$build4239 -EnableRendererAccessibility:$build4239 -InspectStaticLauncher
          } elseif ($env:MAGPIE_DESKTOP_SYNTHETIC_MODELS -ceq 'desktop-synthetic-models-v1') {
              ./build/test-desktop-cold-start.ps1 -Mode observe -BridgeExecutable $bridge -ObserverExecutable $observer -NativeControlExecutable $native -DesktopFixtureProfile synthetic-models-4239 -EnableReviewedStartupProbe -EnableReviewedLaunchCompatibility -EnableReviewedLiveWelcome:(($welcome4239 -or !$inspection) -and !$packageIdentity) -EnableReviewedWelcome4239:$welcome4239 -EnableReadOnlyWinAppInspection:($inspection -and !$packageIdentity -and !$welcome4239) -InspectPackageIdentityOnly:$packageIdentity -EnableReviewedBuild4239:$build4239 -EnableRendererAccessibility:$build4239 -InspectStaticLauncher
          } elseif ([string]$env:MAGPIE_DESKTOP_SYNTHETIC_MODELS -ceq '') {
              $catalog = Join-Path $env:RUNNER_TEMP 'magpie-control-native-models.json'
              ./build/test-desktop-cold-start.ps1 -Mode observe -BridgeExecutable $bridge -ObserverExecutable $observer -NativeControlExecutable $native -NativeControlCatalog $catalog -EnableReviewedStartupProbe -EnableReviewedLaunchCompatibility -EnableReviewedLiveWelcome:(($welcome4239 -or !$inspection) -and !$packageIdentity) -EnableReviewedWelcome4239:$welcome4239 -EnableReadOnlyWinAppInspection:($inspection -and !$packageIdentity -and !$welcome4239) -InspectPackageIdentityOnly:$packageIdentity -EnableReviewedBuild4239:$build4239 -EnableRendererAccessibility:$build4239 -InspectStaticLauncher
          } else { throw 'Unreviewed Desktop fixture selector.' }
      - name: Upload only sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-desktop-policy-trace-${{ github.sha }}
          path: |
            ${{ runner.temp }}/desktop-cold-start-report/report.json
            ${{ runner.temp }}/desktop-cold-start-report/static-launcher-metadata.json
            ${{ runner.temp }}/desktop-cold-start-report/official-window.png
            ${{ runner.temp }}/desktop-cold-start-report/official-window-after-welcome.png
            ${{ runner.temp }}/desktop-cold-start-report/official-window-after-skip.png
            ${{ runner.temp }}/desktop-cold-start-report/official-window-after-skip-confirmation.png
            ${{ runner.temp }}/desktop-cold-start-report/official-window-after-model-menu.png
            ${{ runner.temp }}/desktop-cold-start-report/official-window-after-beta-selection.png
            ${{ runner.temp }}/desktop-cold-start-report/official-window-after-alpha-selection.png
            ${{ runner.temp }}/desktop-cold-start-report/official-window-after-inspection.png
          if-no-files-found: error
          retention-days: 7

