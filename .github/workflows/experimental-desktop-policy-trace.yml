name: Experimental Desktop policy trace

on:
  workflow_dispatch:
    inputs:
      inspection_mode:
        description: Explicitly select a read-only diagnostic
        type: choice
        required: true
        default: disabled
        options:
          - disabled
          - winapp-inspection-v0.7.1
          - package-identity-only-v1
      expected_sha:
        description: Full commit SHA expected for this diagnostic
        type: string
        required: true
  push:
    branches:
      - experiment/app-server-bridge-v0.1.3035
    paths:
      - .github/workflows/experimental-desktop-policy-trace.yml
      - build/desktop-rpc-observer/**
      - build/control-plane-native/**
      - build/desktop-live-welcome*.ps1
      - build/desktop-winapp-inspect*.ps1
      - build/desktop-winapp-welcome*.ps1
      - build/review-desktop-contract*
      - build/desktop-welcome-step*.ps1
      - build/test-desktop-cold-start.ps1
      - build/test-desktop-public-catalog.ps1
      - build/test-desktop-ci-profile.ps1
      - build/inspect-desktop-static-metadata*.mjs
      - build/inspect-desktop-public-plugin-*.mjs
      - build/inspect-desktop-ast-limits*.mjs
      - build/inspect-desktop-mcp-catalog*.mjs
      - build/inspect-desktop-read-callers*.mjs
      - build/vendor/acorn-8.15.0/**
      - internal/appserverbridge/**
      - cmd/magpie-codex-bridge/**

permissions:
  contents: read

concurrency:
  group: experimental-desktop-policy-trace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observer-unit:
    if: github.repository == 'breakingtime126/magpie' && github.ref == 'refs/heads/experiment/app-server-bridge-v0.1.3035' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[native-entry-4239-v1]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[renderer-menu-review-v1]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[app-server-4239-v1]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOTELEMETRY: 'off'
    steps:
      - name: Validate explicit dispatch before checkout
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          DISPATCH_INSPECTION_MODE: ${{ inputs.inspection_mode }}
          DISPATCH_EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRIGGER_SHA: ${{ github.sha }}
          PUSH_PACKAGE_IDENTITY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[package-identity-only-v1]') }}
          PUSH_WINAPP_MARKER: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[winapp-inspection-v0.7.1]') }}
          PUSH_OWNED_CATALOG: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[bridge-owned-catalog-v1]') }}
          PUSH_MODEL_SELECTION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[bridge-model-selection-v1]') }}
          PUSH_MODEL_SETTINGS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[bridge-model-settings-v1]') }}
          PUSH_SYNTHETIC_MODELS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop-synthetic-models-v1]') }}
          PUSH_WELCOME_4239: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[bridge-welcome-4239-v1]') }}
          PUSH_NATIVE_ENTRY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[native-entry-4239-v1]') }}
          PUSH_BUILD_4239: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[bridge-ui-4239-v1]') }}
          PUSH_OTHER_DIAGNOSTIC: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[native-ui-inspection-v1]') || contains(github.event.head_commit.message, '[native-contract-review-v1]')) }}
        run: |
          set -euo pipefail
          if [[ "$TRIGGER_EVENT" == 'workflow_dispatch' ]]; then
            if [[ ( "$DISPATCH_INSPECTION_MODE" != 'winapp-inspection-v0.7.1' &&
                    "$DISPATCH_INSPECTION_MODE" != 'package-identity-only-v1' ) ||
                  ! "$DISPATCH_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ||
                  "$DISPATCH_EXPECTED_SHA" != "$TRIGGER_SHA" ]]; then
              echo 'Explicit inspection mode and matching full expected SHA are required.' >&2
              exit 1
            fi
          fi
          if [[ "$PUSH_MODEL_SETTINGS" == 'true' && "$PUSH_MODEL_SELECTION" != 'true' ]]; then
            echo 'Model settings require the explicit owned model-selection slice.' >&2
            exit 1
          fi
          if [[ "$PUSH_MODEL_SELECTION" == 'true' && "$PUSH_OWNED_CATALOG" != 'true' ]]; then
            echo 'Model selection requires the explicit owned self-authored catalog slice.' >&2
            exit 1
          fi
          if [[ "$PUSH_OWNED_CATALOG" == 'true' && "$PUSH_SYNTHETIC_MODELS" != 'true' ]]; then
            echo 'Owned catalog requires the explicit self-authored welcome slice.' >&2
            exit 1
          fi
          if [[ "$PUSH_SYNTHETIC_MODELS" == 'true' && ( "$PUSH_WELCOME_4239" != 'true' ||
                  "$PUSH_BUILD_4239" != 'true' || "$PUSH_WINAPP_MARKER" != 'true' ||
                  "$PUSH_PACKAGE_IDENTITY" == 'true' || "$PUSH_OTHER_DIAGNOSTIC" == 'true' || "$PUSH_NATIVE_ENTRY" == 'true' ) ]]; then
            echo 'Self-authored models require the exact existing 4239 welcome/menu-only slice.' >&2
            exit 1
          fi
          if [[ "$PUSH_WELCOME_4239" == 'true' && ( "$PUSH_BUILD_4239" != 'true' ||
                  "$PUSH_WINAPP_MARKER" != 'true' || "$PUSH_PACKAGE_IDENTITY" == 'true' ||
                  "$PUSH_OTHER_DIAGNOSTIC" == 'true' || "$PUSH_NATIVE_ENTRY" == 'true' ) ]]; then
            echo 'Welcome actions require their own marker plus the exclusive 4239 alias profile.' >&2
            exit 1
          fi
          if [[ "$PUSH_BUILD_4239" == 'true' && ( "$PUSH_WINAPP_MARKER" != 'true' ||
                  "$PUSH_PACKAGE_IDENTITY" == 'true' || "$PUSH_OTHER_DIAGNOSTIC" == 'true' ) ]]; then
            echo '4239 bridge review requires only its marker and the read-only winapp marker.' >&2
            exit 1
          fi
          if [[ "$PUSH_PACKAGE_IDENTITY" == 'true' && "$PUSH_WINAPP_MARKER" != 'true' ]]; then
            echo 'Package identity pushes also require the existing Desktop-lane exclusion marker.' >&2
            exit 1
          fi
      - name: Check out the exact experimental commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check platform-neutral live supervisor fixtures before regression setup
        shell: pwsh
        run: |
          ./build/desktop-live-welcome.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Platform-neutral live supervisor fixtures failed.' }
          pwsh -NoProfile -File build/test-desktop-ci-profile.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Platform-neutral CI profile fixtures failed.' }
      - name: Set up the pinned Go version
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check source formatting before regression gates
        shell: bash
        run: |
          set -euo pipefail
          format_status=0
          diff="$(gofmt -d build/control-plane-native build/desktop-rpc-observer internal/appserverbridge cmd/magpie-codex-bridge 2>&1)" || format_status=$?
          if [[ "$format_status" -ne 0 || -n "$diff" ]]; then
            printf '%s\n' "$diff"
            while IFS= read -r file; do
              printf 'PROBE_FORMAT_FILE=%s:' "$file"
              gofmt "$file" | base64 -w0
              printf '\n'
            done < <(gofmt -l build/control-plane-native build/desktop-rpc-observer internal/appserverbridge cmd/magpie-codex-bridge || true)
            exit 1
          fi
      - name: Check out exact pre-extension behavior for red regression
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b4775be7ea17a2f34bee7aaef329748dd98610cf
          path: .ci-startup-baseline
          persist-credentials: false
      - name: Prove the new literal-mode test fails on the old behavior
        shell: bash
        run: |
          set -euo pipefail
          cp internal/appserverbridge/probe_167_test.go .ci-startup-baseline/internal/appserverbridge/
          status=0
          output="$(cd .ci-startup-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestStartupProbe167ExactProfile$' ./internal/appserverbridge 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestStartupProbe167ExactProfile'
          echo 'The exact pre-extension code fails behaviorally; the current code must pass next.'
      - name: Check out exact pre-recognition observer behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 49a6aed41c71f8ac74d450d2a98200604ad0017d
          path: .ci-metadata-baseline
          persist-credentials: false
      - name: Prove both metadata recognitions are red on the old observer
        shell: bash
        run: |
          set -euo pipefail
          cp build/desktop-rpc-observer/config_metadata_test.go .ci-metadata-baseline/build/desktop-rpc-observer/
          cp build/desktop-rpc-observer/config_schema_red_test.go .ci-metadata-baseline/build/desktop-rpc-observer/
          status=0
          output="$(cd .ci-metadata-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^(TestForcedLoginMetadataNeverChangesArguments|TestSchemaMetadataRecognizesKnownSpelling)$' ./build/desktop-rpc-observer 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestForcedLoginMetadataNeverChangesArguments'
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestSchemaMetadataRecognizesKnownSpelling'
          echo 'The old observer lacks both exact recognitions; the current tests must pass next.'
      - name: Check out exact pre-auth and pre-literal-key correction behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 31f269b0a6acb9bd5bb7e8d676ca89b797e96e03
          path: .ci-auth-key-baseline
          persist-credentials: false
      - name: Prove exact auth opt-ins and literal-key correction are behavioral regressions
        shell: bash
        run: |
          set -euo pipefail
          cp internal/appserverbridge/auth_167_red_test.go .ci-auth-key-baseline/internal/appserverbridge/
          cp build/desktop-rpc-observer/config_native_key_red_test.go .ci-auth-key-baseline/build/desktop-rpc-observer/
          status=0
          output="$(cd .ci-auth-key-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^(TestExactAuth167LiteralModesNegotiateNativeChildren|TestConfigMetadataPreservesNativeLiteralKeys)$' ./internal/appserverbridge ./build/desktop-rpc-observer 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestExactAuth167LiteralModesNegotiateNativeChildren'
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestConfigMetadataPreservesNativeLiteralKeys'
          echo 'The old code fails both behavior assertions; compilation failures do not qualify.'
      - name: Check out exact pre-bundled-plugin recognition behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: eed7071a22cc9fef22fdf1dc4def78d085f59cc0
          path: .ci-public-plugin-baseline
          persist-credentials: false
      - name: Prove public plugin identification fails behaviorally on the old observer
        shell: bash
        run: |
          set -euo pipefail
          cp build/desktop-rpc-observer/config_public_plugin_red_test.go .ci-public-plugin-baseline/build/desktop-rpc-observer/
          status=0
          output="$(cd .ci-public-plugin-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestPublicPluginOverridesRecognizedWithoutMutation$' ./build/desktop-rpc-observer 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestPublicPluginOverridesRecognizedWithoutMutation'
          echo 'The old observer does not recognize these fixed public keys; the current code must pass next.'
      - name: Check out exact pre-AST and pre-shape diagnostic behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e1ceddf7542163cfaacdc975a72387e51b2aeb82
          path: .ci-modern-js-baseline
          persist-credentials: false
      - name: Prove complete modern JavaScript parsing fails behaviorally on the old scanner
        shell: bash
        run: |
          set -euo pipefail
          cp build/inspect-desktop-public-plugin-ast-red.test.mjs .ci-modern-js-baseline/build/
          status=0
          output="$(cd .ci-modern-js-baseline && node --test --test-reporter=tap build/inspect-desktop-public-plugin-ast-red.test.mjs 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- 'not ok 1 - complete modern JavaScript retains public plugin literals'
          printf '%s\n' "$output" | grep -F -- 'complete modern JavaScript must retain the public identity after a v-flag regexp'
          echo 'The old scanner fails the modern-syntax behavior assertion; missing imports or APIs do not qualify.'
      - name: Prove fixed plugin path shapes fail behaviorally on the old observer
        shell: bash
        run: |
          set -euo pipefail
          cp build/desktop-rpc-observer/config_plugin_shape_red_test.go .ci-modern-js-baseline/build/desktop-rpc-observer/
          status=0
          output="$(cd .ci-modern-js-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestPluginShapeUnknownPathMetadataRed$' ./build/desktop-rpc-observer 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestPluginShapeUnknownPathMetadataRed'
          printf '%s\n' "$output" | grep -F -- 'unknown plugin path missing fixed app_tool_enabled shape'
          echo 'The old observer fails the fixed-shape assertion; compilation or setup failures do not qualify.'
      - name: Check out exact pre-partial AST limit behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: af097bf4336559cb468ffb72b7458458845f2a9b
          path: .ci-ast-limit-baseline
          persist-credentials: false
      - name: Prove fixed AST reasons and independent partial evidence fail on the old scanner
        shell: bash
        run: |
          set -euo pipefail
          cp build/inspect-desktop-ast-limits-red.test.mjs .ci-ast-limit-baseline/build/
          status=0
          output="$(cd .ci-ast-limit-baseline && node --max-old-space-size=512 --test --test-reporter=tap build/inspect-desktop-ast-limits-red.test.mjs 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- 'not ok 1 - explicit AST guard preserves its fixed reason'
          printf '%s\n' "$output" | grep -F -- 'explicit parse-depth guard must retain its fixed resource reason'
          printf '%s\n' "$output" | grep -F -- 'not ok 2 - limited source preserves independent public evidence'
          printf '%s\n' "$output" | grep -F -- 'a file-local AST limit must preserve only complete independent public evidence'
          echo 'Both old AST-limit behaviors fail explicitly; import, setup or compilation failures do not qualify.'
      - name: Check out exact pre-MCP catalog behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e1c8fb52c61406baba1a6d712c0fcea83aacaf0d
          path: .ci-mcp-catalog-baseline
          persist-credentials: false
      - name: Prove source-bound MCP declarations fail on the old scanner
        shell: bash
        run: |
          set -euo pipefail
          cp build/inspect-desktop-mcp-catalog-red.test.mjs .ci-mcp-catalog-baseline/build/
          status=0
          output="$(cd .ci-mcp-catalog-baseline && node --max-old-space-size=512 --test --test-reporter=tap build/inspect-desktop-mcp-catalog-red.test.mjs 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- 'not ok 1 - public MCP declarations produce source-bound nested candidates'
          printf '%s\n' "$output" | grep -F -- 'source-bound nested MCP declaration key missing'
          echo 'The old scanner lacks the source-bound declaration; missing APIs or setup failures do not qualify.'
      - name: Prove nested MCP references fail on the old observer
        shell: bash
        run: |
          set -euo pipefail
          cp build/desktop-rpc-observer/config_public_mcp_catalog_red_test.go .ci-mcp-catalog-baseline/build/desktop-rpc-observer/
          status=0
          output="$(cd .ci-mcp-catalog-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestPublicMCPManifestCatalogRecognizedWithoutMutation$' ./build/desktop-rpc-observer 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestPublicMCPManifestCatalogRecognizedWithoutMutation'
          printf '%s\n' "$output" | grep -F -- 'source-bound nested MCP catalog key was rejected'
          echo 'The old observer rejects the reviewed nested catalog grammar; compilation failures do not qualify.'
      - name: Prove exact authentication method metadata fails on the old observer
        shell: bash
        run: |
          set -euo pipefail
          cp build/desktop-rpc-observer/auth_metadata_test.go .ci-mcp-catalog-baseline/build/desktop-rpc-observer/
          status=0
          output="$(cd .ci-mcp-catalog-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestGetAuthStatusMetadataKeepsAuthenticationOpaque$' ./build/desktop-rpc-observer 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestGetAuthStatusMetadataKeepsAuthenticationOpaque'
          printf '%s\n' "$output" | grep -F -- 'exact authentication method metadata was not correlated'
          echo 'The old observer lacks this exact metadata label; raw auth data must remain opaque in current tests.'
      - name: Prove exact null-only requirements reads fail on the old bridge
        shell: bash
        run: |
          set -euo pipefail
          cp internal/appserverbridge/requirements_167_red_test.go .ci-mcp-catalog-baseline/internal/appserverbridge/
          status=0
          output="$(cd .ci-mcp-catalog-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestExactRequirements167LiteralModeFreshNativeReads$' ./internal/appserverbridge 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestExactRequirements167LiteralModeFreshNativeReads'
          printf '%s\n' "$output" | grep -F -- 'exact 0.167 null-only requirements mode must validate: unsupported config_requirements_read'
          echo 'The old bridge rejects the exact new mode; compilation or setup failures do not qualify.'
      - name: Check out exact pre-Desktop-plugin forwarding behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 643cc5d060659c68c75e342e7e0fd71590b6993c
          path: .ci-desktop-plugin-baseline
          persist-credentials: false
      - name: Prove the exact Desktop plugin literal fails on the old adapter
        shell: bash
        run: |
          set -euo pipefail
          cp cmd/magpie-codex-bridge/desktop_plugin_red_test.go .ci-desktop-plugin-baseline/cmd/magpie-codex-bridge/
          status=0
          output="$(cd .ci-desktop-plugin-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestDesktopPluginLiteralReachesLaunchOptions$' ./cmd/magpie-codex-bridge 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestDesktopPluginLiteralReachesLaunchOptions'
          printf '%s\n' "$output" | grep -F -- 'exact reviewed Desktop plugin literal must reach normal launch:'
          echo 'The old parser rejects the exact reviewed literal; compilation or setup failures do not qualify.'
      - name: Check out exact pre-optional-initialized behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bcc80e7c31fa65f01e181c3eee08759862affa8a
          path: .ci-initialize-baseline
          persist-credentials: false
      - name: Prove omitted initialized fails behaviorally on the old bridge
        shell: bash
        run: |
          set -euo pipefail
          cp internal/appserverbridge/initialize_test.go .ci-initialize-baseline/internal/appserverbridge/
          status=0
          output="$(cd .ci-initialize-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestInitializeReadyWithoutNotification$' ./internal/appserverbridge 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestInitializeReadyWithoutNotification'
          printf '%s\n' "$output" | grep -F -- 'account/read blocked after both initialize responses without initialized:'
          echo 'The old bridge fails after genuine successful initialization; compilation or setup failures do not qualify.'
      - name: Prove requested auth flags are not observed by the old observer
        shell: bash
        run: |
          set -euo pipefail
          cp build/desktop-rpc-observer/auth_request_metadata_red_test.go .ci-initialize-baseline/build/desktop-rpc-observer/
          status=0
          output="$(cd .ci-initialize-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestGetAuthStatusRequestedFlagsObserved$' ./build/desktop-rpc-observer 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestGetAuthStatusRequestedFlagsObserved'
          printf '%s\n' "$output" | grep -F -- 'getAuthStatus requested flag metadata missing or incorrect'
          echo 'The old observer lacks bounded requested-flag metadata; compilation or setup failures do not qualify.'
      - name: Check out exact pre-native-trace behavior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 3c3d18fb877e8d376836459c498b1f99f501632d
          path: .ci-native-trace-baseline
          persist-credentials: false
      - name: Prove native trace requests fail behaviorally on the old bridge
        shell: bash
        run: |
          set -euo pipefail
          cp internal/appserverbridge/native_trace_167_red_test.go .ci-native-trace-baseline/internal/appserverbridge/native_trace_167_red_test.go
          status=0
          output="$(cd .ci-native-trace-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestNativeTrace167RequirementsAcceptedWithoutPropagation$' ./internal/appserverbridge 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestNativeTrace167RequirementsAcceptedWithoutPropagation'
          printf '%s\n' "$output" | grep -F -- 'bounded native trace must permit a fresh dual requirements read'
          echo 'The old code fails the exact behavior assertion; compilation or setup failures do not qualify.'
      - name: Prove native trace metadata fails behaviorally on the old observer
        shell: bash
        run: |
          set -euo pipefail
          cp build/desktop-rpc-observer/native_trace_red_test.go .ci-native-trace-baseline/build/desktop-rpc-observer/native_trace_red_test.go
          status=0
          output="$(cd .ci-native-trace-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestNativeTraceMetadataRecognizesSchemaWithoutValues$' ./build/desktop-rpc-observer 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestNativeTraceMetadataRecognizesSchemaWithoutValues'
          printf '%s\n' "$output" | grep -F -- 'native trace presence/validity metadata missing or incorrect'
          echo 'The old code fails the exact behavior assertion; compilation or setup failures do not qualify.'
      - name: Prove exact startup method labels fail behaviorally on the old observer
        shell: bash
        run: |
          set -euo pipefail
          cp build/desktop-rpc-observer/native_methods_red_test.go .ci-native-trace-baseline/build/desktop-rpc-observer/native_methods_red_test.go
          status=0
          output="$(cd .ci-native-trace-baseline && go test -v -count=1 -timeout=5m -tags nogui -run '^TestNativeStartupMethodsAreExactMetadataOnly$' ./build/desktop-rpc-observer 2>&1)" || status=$?
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F -- '--- FAIL: TestNativeStartupMethodsAreExactMetadataOnly'
          printf '%s\n' "$output" | grep -F -- 'reviewed native startup method lacks its exact metadata label'
          echo 'The old code fails the exact behavior assertion; compilation or setup failures do not qualify.'
      - name: Check out exact pre-no-auth and pre-complete-vocabulary behavior
