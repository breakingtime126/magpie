# Diagnostic only: names, never values. Always abort; no native/toolchain download.
# Commit marker [app-server-4239-v1] skips legacy broad jobs, not a passed test.
name: Raw initialize admission names diagnostic
on:
  push:
    branches: ['experiment/app-server-bridge-v0.1.3035']
    paths:
      - '.github/workflows/raw-strict-startup-initialize.yml'
      - 'evidence/windows-native-initialize-plan/**'
permissions: {}
jobs:
  raw-strict-initialize:
    runs-on: windows-2022
    timeout-minutes: 2
    steps:
      - name: Report matched safe environment names and unconditionally stop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $trustNames=@('SystemRoot','WINDIR','HTTP_PROXY','HTTPS_PROXY','NO_PROXY','ALL_PROXY','SSL_CERT_FILE','SSL_CERT_DIR','NODE_EXTRA_CA_CERTS','REQUESTS_CA_BUNDLE','CURL_CA_BUNDLE')
          $diagnosticLines = [Collections.Generic.List[string]]::new()
          $unsafeMatchedName = $false
          # Read only names for this diagnostic. Never access/format .Value,
          # dump Env:, invoke external programs, or change the environment.
          $names = @(Get-ChildItem Env: -Name)
          foreach ($name in $names) {
            $upper=$name.ToUpperInvariant()
            $categories=[Collections.Generic.List[string]]::new()
            if ($upper -match '^(CODEX_|OPENAI_)') { $categories.Add('application-policy') }
            if ($upper -match '^(AWS_|AZURE_|GOOGLE_|GCP_)') { $categories.Add('provider-context') }
            if ($upper -match '^OTEL_') { $categories.Add('telemetry-authority') }
            if ($upper -match '(_API_KEY|_ACCESS_TOKEN)$') { $categories.Add('auth-input') }
            if ($upper -match '(PROXY|CERT|SSL|TLS|TRUST|CA_BUNDLE)' -and $trustNames -notcontains $name) { $categories.Add('unreviewed-trust-proxy') }
            if ($categories.Count -eq 0) { continue }
            if ($name -cnotmatch '\A[A-Za-z_][A-Za-z0-9_]{0,63}\z') {
              $unsafeMatchedName=$true
              continue
            }
            $categoryText=($categories | Sort-Object -Unique) -join ','
            $diagnosticLines.Add("ADMISSION_NAME name=$name categories=$categoryText")
          }
          $diagnosticLines | Sort-Object -Unique | ForEach-Object { Write-Output $_ }
          if ($unsafeMatchedName) { Write-Output 'ADMISSION_NAME unsafe-identifier-withheld; no value disclosed' }
          if ($diagnosticLines.Count -eq 0) { Write-Output 'ADMISSION_NAME no safely reportable matched identifiers' }
          throw 'EXPECTED DIAGNOSTIC STOP: names only; no download, native execution, admission bypass, or initialize acceptance'
